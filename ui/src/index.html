<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>Welcome to Tauri</h1>

      <button id="connect-btn">Conectar con Gmail</button>
      <p id="status"></p>
      <form id="search-form">
        <input id="query" placeholder="from:linkedin.com older_than:1y" />
        <button type="submit">Buscar</button>
      </form>
      <p id="result"></p>
      <table id="emails">
        <thead>
          <tr>
            <th><input type="checkbox" id="select-all" /></th>
            <th>Fecha</th>
            <th>De</th>
            <th>Asunto</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <button id="more-btn" style="display: none">Cargar más</button>
    </main>
  </body>
</html>
